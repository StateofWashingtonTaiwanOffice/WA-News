<style>
/* Layout: single-column mobile reader styled after the WA Commerce pop-up stand: white logo bar, bright green gradient band, orange accents. */
:root {
  --bg: #f5f8f2;
  --surface: #ffffff;
  --ink: #1d2a1f;
  --muted: #5f6b60;
  --line: #e1e8dc;
  --green: #2e9b45;
  --green-light: #8cc63f;
  --green-soft: #eaf5e1;
  --orange: #e8611a;
  --orange-soft: #fdeee4;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 40px; }

.logobar { background: var(--surface); padding: 14px 16px 12px; }
.logobar-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logobar img { height: 52px; width: auto; display: block; }
.logobar .office { font-size: 13px; font-weight: 700; color: var(--green); text-align: right; line-height: 1.4; display: grid; gap: 2px; }
.logobar .office-en { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
@media (max-width: 400px) { .logobar img { height: 44px; } .logobar .office { font-size: 12px; } .logobar .office-en { font-size: 10px; } }
.band {
  background: linear-gradient(90deg, var(--green) 0%, var(--green) 35%, var(--green-light) 100%);
  color: #fff; padding: 14px 16px;
}
.band-inner { max-width: 680px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.band h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: .04em; line-height: 1.3; }
.band .en { font-size: 14px; font-weight: 700; letter-spacing: .06em; opacity: .95; }

.tools { display: grid; gap: 10px; padding: 18px 0 6px; }
.search {
  width: 100%; padding: 11px 14px; font: inherit; font-size: 16px;
  border: 2px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink);
}
.search:focus-visible { outline: none; border-color: var(--green); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 2px solid var(--green); background: var(--surface); color: var(--green);
  font: inherit; font-size: 14px; font-weight: 700; padding: 4px 16px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--green); color: #fff; }
.chip:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

.count { font-size: 13px; color: var(--muted); padding: 6px 2px; }
.list { display: grid; gap: 14px; }
.card {
  display: grid; gap: 6px; text-decoration: none; color: inherit; overflow: hidden;
  background: var(--surface); border-radius: 18px; padding: 16px;
  box-shadow: 0 1px 2px rgba(30,60,30,.06), 0 4px 14px rgba(30,60,30,.06);
  border-top: 6px solid var(--green);
}
.card:nth-child(even) { border-top-color: var(--orange); }
.card:active { background: var(--green-soft); }
.card:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.card .thumb { margin: -16px -16px 6px; aspect-ratio: 16 / 9; background: var(--green-soft); }
.card .thumb img, .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero { margin: -22px -18px 16px; aspect-ratio: 16 / 9; background: var(--green-soft); overflow: hidden; }
.meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.tag { background: var(--orange); color: #fff; font-weight: 700; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; }
.date { font-variant-numeric: tabular-nums; }
.card h2 { font-size: 18px; line-height: 1.5; margin: 0; font-weight: 700; color: var(--green); text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14.5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

.back {
  display: inline-flex; align-items: center; gap: 6px; margin: 16px 0 6px;
  background: none; border: 0; color: var(--green); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; padding: 6px 0;
}
.back:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
article { background: var(--surface); border-radius: 18px; padding: 22px 18px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(30,60,30,.06), 0 4px 14px rgba(30,60,30,.06); border-top: 6px solid var(--green); }
article .hero + .meta { margin-top: 0; }
article h2 { font-size: 23px; line-height: 1.45; margin: 10px 0 14px; color: var(--green); text-wrap: balance; }
article .lead { font-size: 16px; color: var(--ink); background: var(--orange-soft); border-left: 4px solid var(--orange); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 0 0 18px; }
article .body p { margin: 0 0 1em; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  text-decoration: none; border: 2px solid var(--orange);
}
.btn.primary { background: var(--orange); color: #fff; }
.btn.ghost { background: transparent; color: var(--orange); }
.btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.source { font-size: 13px; color: var(--muted); margin-top: 10px; }

footer { background: var(--surface); border-top: 6px solid var(--green-light); padding: 22px 16px 26px; }
.foot-inner { max-width: 680px; margin: 0 auto; display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.foot-inner strong { color: var(--green); font-size: 15px; letter-spacing: .06em; }
.foot-inner a { color: var(--orange); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  #listView, #articleView { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .6; } to { opacity: 1; } }
}
</style>
</head>

<script>
/* =====================================================
   設定：把 Google 試算表「發布到網路」的 CSV 連結貼在下面引號裡
   ===================================================== */
/* 試算表 ID：試算表網址 /d/ 和 /edit 中間那一串（試算表要設成「知道連結的任何人都能檢視」） */
const SHEET_ID = "10n7kgmTMn4lwcmRbBEKk57S7OLs7v9olHr7upOSamG8";
/* 備用：發布到網路的 CSV 連結 */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrhJIz9gS_XP5_OaAi-JRxxcDOPHFYUsSenZk3QvsLB_j1I2eN8p8dLvoBZViocW217nbndpud88oz/pub?output=csv";

/* 試算表第一列的欄位名稱（順序可以不同，但名稱要一樣） */
const COLS = { date: "日期", category: "分類", title: "標題", summary: "摘要", body: "內文", source: "來源", url: "原文連結", image: "圖片連結" };

/* ===================================================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let NEWS = [];
let cat = "全部";

function parseCSV(text) {
  const rows = []; let row = []; let f = ""; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function normDate(s) {
  const m = String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : "";
}
function fmtDate(d) { if (!d) return ""; const [y,m,day] = d.split("-"); return `${y}年${+m}月${+day}日`; }
function makeId(s) {
  let h = 5381; for (const ch of s) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0;
  return "n" + h.toString(36);
}

/* Google 雲端硬碟的分享連結自動轉成可以顯示的圖片網址 */
function imgUrl(u) {
  if (!/^https?:\/\//.test(u)) return "";
  if (/drive\.google\.com/.test(u)) {
    const m = u.match(/\/d\/([\w-]{20,})/) || u.match(/[?&]id=([\w-]{20,})/);
    if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  }
  return u;
}
const imgTag = (n) => n.image ? `<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()">` : "";

function rowsToNews(rows) {
  const header = rows[0].map(h => h.trim());
  const idx = {}; for (const k in COLS) idx[k] = header.indexOf(COLS[k]);
  const get = (r, k) => idx[k] >= 0 ? (r[idx[k]] || "").trim() : "";
  return rows.slice(1)
    .filter(r => get(r, "title"))
    .map(r => {
      const date = normDate(get(r, "date"));
      const title = get(r, "title");
      return {
        id: makeId(date + title), date, title,
        category: get(r, "category") || "新聞",
        summary: get(r, "summary"),
        body: get(r, "body").split(/\n+/).map(s => s.trim()).filter(Boolean),
        source: get(r, "source"),
        url: /^https?:\/\//.test(get(r, "url")) ? get(r, "url") : "",
        image: imgUrl(get(r, "image"))
      };
    })
    .sort((a, b) => b.date.localeCompare(a.date));
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const items = NEWS.filter(n =>
    (!q || [n.title, n.summary, ...n.body].join(" ").toLowerCase().includes(q)));
  $("#count").textContent = `共 ${items.length} 則新聞`;
  $("#list").innerHTML = items.length ? items.map(n => `
    <a class="card" href="#${esc(n.id)}">
      ${n.image ? `<div class="thumb">${imgTag(n)}</div>` : ""}
      <div class="meta"><span class="date">${fmtDate(n.date)}</span></div>
      <h2>${esc(n.title)}</h2>
      ${n.summary ? `<p>${esc(n.summary)}</p>` : ""}
    </a>`).join("") : `<div class="empty">找不到符合的新聞</div>`;
}

function renderArticle(n) {
  const link = n.url ? `<a class="btn primary" href="${esc(n.url)}" target="_blank" rel="noopener">閱讀原文 ›</a>` : "";
  $("#article").innerHTML = `
    ${n.image ? `<div class="hero">${imgTag(n)}</div>` : ""}
    <div class="meta"><span class="date">${fmtDate(n.date)}</span></div>
    <h2>${esc(n.title)}</h2>
    ${n.summary ? `<p class="lead">${esc(n.summary)}</p>` : ""}
    <div class="body">${n.body.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    ${n.source ? `<div class="source">資料來源：${esc(n.source)}</div>` : ""}
    <div class="actions">${link}<button class="btn ghost" type="button" id="copyBtn">複製這則連結</button></div>`;
  $("#copyBtn").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(location.href); e.target.textContent = "已複製連結"; }
    catch { e.target.textContent = "請長按網址列複製"; }
  });
}

function route() {
  const n = NEWS.find(x => x.id === location.hash.slice(1));
  if (n) {
    renderArticle(n);
    $("#listView").hidden = true; $("#articleView").hidden = false;
    window.scrollTo(0, 0);
  } else {
    $("#articleView").hidden = true; $("#listView").hidden = false;
  }
}

let cameFromList = false;
$("#list").addEventListener("click", (e) => { if (e.target.closest(".card")) cameFromList = true; });
$("#q").addEventListener("input", renderList);
$("#backBtn").addEventListener("click", () => {
  if (cameFromList) { cameFromList = false; history.back(); }
  else { location.hash = "list"; }
});
window.addEventListener("hashchange", route);

/* 方法一：Google 試算表 gviz（用 script 標籤載入，不受跨網站限制） */
function loadGviz() {
  return new Promise((resolve, reject) => {
    if (!SHEET_ID) return reject(new Error("no id"));
    const cb = "__waNews" + Date.now();
    const sc = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; sc.remove(); }
    window[cb] = (resp) => {
      cleanup();
      try {
        if (resp.status === "error") throw new Error("sheet error");
        const t = resp.table;
        const cell = (c) => c == null ? "" : String(c.f ?? c.v ?? "");
        let rows = t.rows.map(r => r.c.map(cell));
        const labels = t.cols.map(c => c.label || "");
        if (labels.some(l => l.trim())) rows.unshift(labels);
        resolve(rows);
      } catch (e) { reject(e); }
    };
    sc.onerror = () => { cleanup(); reject(new Error("script error")); };
    sc.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?headers=1&tqx=out:json;responseHandler:${cb}&t=${Date.now()}`;
    document.head.appendChild(sc);
  });
}
/* 方法二：發布到網路的 CSV */
async function loadCsv() {
  if (!SHEET_CSV_URL) throw new Error("no csv");
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error(res.status);
  return parseCSV(await res.text());
}

async function load() {
  $("#count").textContent = "新聞載入中…";
  if (!SHEET_ID && !SHEET_CSV_URL) { $("#count").textContent = ""; $("#list").innerHTML = `<div class="empty">尚未設定新聞試算表</div>`; return; }
  let rows = null;
  for (const fn of [loadGviz, loadCsv]) {
    try { rows = await fn(); if (rows && rows.length > 1) break; } catch (e) { console.warn(fn.name, e); }
  }
  if (!rows || rows.length < 2) {
    $("#count").textContent = "";
    $("#list").innerHTML = `<div class="empty">新聞暫時載入失敗，請稍後再試一次</div>`;
    return;
  }
  NEWS = rowsToNews(rows);
  renderList(); route();
}
load();
</script>
